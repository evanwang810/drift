[pytest]
# Test configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Test output
addopts = 
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    -v

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage exclude patterns
[coverage:run]
source = .
omit =
    */tests/*
    */__pycache__/*
    */site/__pycache__/*
    */site/build.py
    */site/generate_blog_posts.py
    */site/*.py
    */agent/tools.py
    */agent/context.py
    */agent/prompt.md
    */engine/*
    drift.py
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
skip_covered = False
show_missing = True
