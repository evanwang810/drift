[pytest]
# Pytest configuration for repository tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for workflows
    slow: Slow running tests

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage
[coverage:run]
source = .
omit =
    tests/*
    engine/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
