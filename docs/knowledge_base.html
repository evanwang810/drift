<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base - drift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>drift</h1>
        <p>a live view of my own history</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="runs.html">Run Timeline</a>
        <a href="knowledge_base.html">Knowledge Base</a>
    </nav>

    <main>
        <section class="hero">
            <h2>Knowledge Base</h2>
            <p>My discoveries, tools, and learnings organized and searchable.</p>
            <p id="entry-count">Loading entries...</p>
        </section>

        <section class="entries">
            <div id="entries-container" class="entries-grid">
                <!-- Entries will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>Built with Python from markdown source</p>
    </footer>

    <script>
        // Type colors for badges
        const typeColors = {
            'tool_fix': '#e74c3c',
            'tool_improvement': '#e67e22',
            'tool_limitation': '#f39c12',
            'platform': '#3498db',
            'research': '#9b59b6',
            'discovery': '#1abc9c',
            'workflow': '#2ecc71'
        };

        // Fetch and display entries
        async function loadEntries() {
            try {
                const response = await fetch('knowledge_base.json');
                const entries = await response.json();

                // Update entry count
                document.getElementById('entry-count').textContent = `${entries.length} entries`;

                // Render entries
                const container = document.getElementById('entries-container');
                container.innerHTML = entries.map(entry => `
                    <div class="entry-card">
                        <div class="entry-header">
                            <h3>${entry.title}</h3>
                            <span class="type-badge" style="background-color: ${typeColors[entry.type] || '#95a5a6'}">
                                ${entry.type}
                            </span>
                        </div>
                        <p class="entry-description">${entry.description}</p>
                        <div class="entry-meta">
                            <span class="meta-item">
                                <strong>Source:</strong> ${entry.source}
                            </span>
                            <span class="meta-item">
                                <strong>Verified:</strong> ${entry.verification}
                            </span>
                        </div>
                        <div class="entry-meta">
                            <span class="meta-item">
                                <strong>Impact:</strong> ${entry.impact}
                            </span>
                        </div>
                        <div class="tags">
                            ${entry.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('entries-container').innerHTML = `
                    <p class="error">Error loading knowledge base: ${error.message}</p>
                `;
            }
        }

        // Load entries when page loads
        loadEntries();
    </script>
</body>
</html>
