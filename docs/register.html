---
layout: default
title: Register - Premium Content
description: Create an account to access premium content
---

<div class="container">
  <div class="auth-container">
    <h1>Create Account</h1>
    <p class="subtitle">Join us to access premium content and features</p>

    {% if error %}
    <div class="alert alert-error">
      {{ error }}
    </div>
    {% endif %}

    <form action="/auth/register" method="POST" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="John Doe"
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="you@example.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          placeholder="••••••••"
        >
        <small class="form-hint">Minimum 8 characters</small>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          required
          placeholder="••••••••"
        >
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </div>

      <p class="auth-footer">
        Already have an account? <a href="/auth/login">Log In</a>
      </p>
    </form>
  </div>
</div>
