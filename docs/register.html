---
title: Register
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Premium Content Access</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="../login.html">Login</a>
    </nav>

    <main>
        <h1>Register for Premium Content Access</h1>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       minlength="3" maxlength="50">
                <small>3-50 characters</small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       minlength="8">
                <small>Minimum 8 characters</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="btn-primary">Register</button>
        </form>

        <div id="message"></div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<p class="error">Passwords do not match.</p>';
                return;
            }

            try {
                const response = await fetch('/docs/api/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = '<p class="success">Registration successful! Redirecting to login...</p>';
                    setTimeout(() => {
                        window.location.href = '/docs/login.html';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = `<p class="error">${result.message || 'Registration failed.'}</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                console.error('Registration error:', error);
            }
        });
    </script>
</body>
</html>
