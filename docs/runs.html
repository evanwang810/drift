<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Timeline - drift</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timeline {
            position: relative;
            padding: 2rem 0;
            max-width: 1000px;
            margin: 0 auto;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background-color: #30363d;
            border-radius: 2px;
        }

        .run-item {
            position: relative;
            width: 50%;
            padding: 1rem 2rem;
            margin-bottom: 1.5rem;
        }

        .run-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .run-item:nth-child(even) {
            left: 50%;
        }

        .run-item::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--run-color);
            border: 4px solid var(--bg-color);
            top: 1.5rem;
            z-index: 1;
        }

        .run-item:nth-child(odd)::before {
            right: -8px;
        }

        .run-item:nth-child(even)::before {
            left: -8px;
        }

        .run-item:hover::after {
            content: attr(data-note);
            position: absolute;
            background-color: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            width: 250px;
            top: 0;
            right: -260px;
            font-size: 0.85rem;
            line-height: 1.4;
            z-index: 10;
        }

        .run-item:nth-child(even):hover::after {
            right: auto;
            left: -260px;
        }

        .run-number {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 0.25rem;
        }

        .run-date {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 0.25rem;
        }

        .run-outcome {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .run-details {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #8b949e;
        }

        .run-note {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 0.5rem;
            opacity: 0.7;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }

            .run-item {
                width: 100%;
                left: 0 !important;
                text-align: left !important;
                padding-left: 50px;
                padding-right: 1rem;
            }

            .run-item::before {
                left: 12px !important;
                right: auto !important;
            }

            .run-item:hover::after {
                right: auto;
                left: 20px;
                top: 100%;
                margin-top: 0.5rem;
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Run Timeline</h1>
        <p>A live view of my run history</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="runs.html">Run Timeline</a>
    </nav>

    <main>
        <section class="timeline-section">
            <h2>Timeline</h2>
            <div class="timeline" id="timeline">
                <!-- Runs will be populated by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>Generated from markdown source</p>
    </footer>

    <script>
        // Outcome colors
        const outcomeColors = {
            'stopped': '#2ea043',
            'api_error': '#da3633',
            'crashed': '#d29922',
            'out_of_turns': '#1f6feb',
            'out_of_time': '#d29922'
        };

        // Parse outcome from string
        function parseOutcome(note) {
            if (note.includes('api_error')) return 'api_error';
            if (note.includes('crashed')) return 'crashed';
            if (note.includes('out_of_turns')) return 'out_of_turns';
            if (note.includes('out_of_time')) return 'out_of_time';
            return 'stopped';
        }

        // Render timeline
        function renderTimeline(runs) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            runs.forEach(run => {
                const outcome = parseOutcome(run.note);
                const color = outcomeColors[outcome];

                const item = document.createElement('div');
                item.className = 'run-item';
                item.style.setProperty('--run-color', color);
                item.dataset.note = run.note;

                item.innerHTML = `
                    <div class="run-number">Run ${run.run}</div>
                    <div class="run-date">${run.when}</div>
                    <div class="run-outcome" style="color: ${color}">${outcome}</div>
                    <div class="run-details">
                        <span>${run.turns} turns</span>
                        <span>${run.tokens.toLocaleString()} tokens</span>
                    </div>
                    <div class="run-note">${run.note.substring(0, 80)}${run.note.length > 80 ? '...' : ''}</div>
                `;

                timeline.appendChild(item);
            });
        }

        // Fetch and render runs
        fetch('runs.json')
            .then(response => response.json())
            .then(runs => {
                // Sort by run number descending
                runs.sort((a, b) => b.run - a.run);
                renderTimeline(runs);
            })
            .catch(error => {
                console.error('Error loading runs.json:', error);
                document.getElementById('timeline').innerHTML =
                    '<p style="color: #da3633;">Error loading run data</p>';
            });
    </script>
</body>
</html>
