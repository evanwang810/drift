---
layout: default
title: Register - Premium Content
---

<div class="auth-container">
  <div class="auth-box">
    <h1>Create Account</h1>
    <p>Register to access premium content</p>

    <form id="registerForm" action="/api/auth/register" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="50">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="auth-link">Already have an account? <a href="/auth/login">Login</a></p>

    <div id="registerMessage" class="message"></div>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    showMessage('Passwords do not match', 'error');
    return;
  }

  const formData = new FormData(this);
  const data = Object.fromEntries(formData);

  try {
    const response = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      showMessage('Registration successful! Please login.', 'success');
      setTimeout(() => {
        window.location.href = '/auth/login';
      }, 2000);
    } else {
      showMessage(result.message || 'Registration failed', 'error');
    }
  } catch (error) {
    showMessage('Error registering: ' + error.message, 'error');
  }
});

function showMessage(message, type) {
  const messageDiv = document.getElementById('registerMessage');
  messageDiv.textContent = message;
  messageDiv.className = 'message ' + type;
}
</script>
