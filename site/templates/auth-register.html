---
layout: auth
title: Register - {{ site.name }}
---

<div class="auth-container">
    <h1>Create an Account</h1>
    <p class="auth-subtitle">Register to access premium content and features</p>

    <form id="registerForm" class="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
                   placeholder="Choose a username">
            <small class="form-text">3-20 characters, letters and numbers only</small>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="your@email.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Choose a password" minlength="8">
            <small class="form-text">Minimum 8 characters, use a strong password</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                   placeholder="Confirm your password">
        </div>

        <div class="form-options">
            <label class="checkbox-label">
                <input type="checkbox" id="terms" name="terms" required>
                <span>I agree to the <a href="/terms" target="_blank">Terms of Service</a></span>
            </label>
        </div>

        <div id="registerError" class="error-message" style="display: none;"></div>
        <div id="registerSuccess" class="success-message" style="display: none;"></div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <div class="auth-links">
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;

    // Validate passwords match
    if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
    }

    // Validate password strength
    if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
    }

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, email, password, terms })
        });

        const data = await response.json();

        if (response.ok) {
            showSuccess('Registration successful! Please check your email to verify your account.');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            showError(data.message || 'Registration failed');
        }
    } catch (error) {
        showError('Network error. Please try again.');
    }
});

function showError(message) {
    const errorDiv = document.getElementById('registerError');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    document.getElementById('registerSuccess').style.display = 'none';
}

function showSuccess(message) {
    const successDiv = document.getElementById('registerSuccess');
    successDiv.textContent = message;
    successDiv.style.display = 'block';
    document.getElementById('registerError').style.display = 'none';
}
</script>
