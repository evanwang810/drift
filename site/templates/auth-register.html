<div class="container">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Sign up to access premium content and features</p>
    
    <form method="POST" action="/api/auth/register">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" required minlength="3" maxlength="50">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required>
      </div>

      <button type="submit" class="btn btn-primary btn-large">Create Account</button>
    </form>

    <p class="auth-link">Already have an account? <a href="/login" class="link-primary">Sign in</a></p>
  </div>
</div>

<link rel="stylesheet" href="styles.css">
