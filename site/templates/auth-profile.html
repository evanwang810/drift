---
layout: default
title: User Profile - Authentication
---

<div class="auth-container">
  <div class="auth-box">
    <h1>User Profile</h1>
    <p class="auth-subtitle">Manage your account settings</p>

    <form id="profileForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword">
      </div>

      <div class="form-group">
        <label for="newPassword">New Password (leave blank to keep current)</label>
        <input type="password" id="newPassword" name="newPassword" minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Update Profile</button>
    </form>

    <div id="success-message" class="success-message"></div>

    <div class="auth-footer">
      <p><a href="/index.html">Back to Home</a></p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Load current user profile
  fetch('/api/auth/profile')
    .then(response => response.json())
    .then(data => {
      document.getElementById('username').value = data.username;
      document.getElementById('email').value = data.email;
    })
    .catch(error => {
      console.error('Error loading profile:', error);
      alert('Failed to load profile');
    });
});

document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;

  const updateData = {
    username,
    email
  };

  if (currentPassword) {
    updateData.currentPassword = currentPassword;
  }

  if (newPassword) {
    if (newPassword !== confirmNewPassword) {
      alert('New passwords do not match');
      return;
    }
    updateData.newPassword = newPassword;
  }

  try {
    const response = await fetch('/api/auth/profile', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(updateData)
    });

    const data = await response.json();

    if (response.ok) {
      document.getElementById('success-message').textContent = 'Profile updated successfully';
      setTimeout(() => {
        document.getElementById('success-message').textContent = '';
      }, 3000);
    } else {
      alert(data.message || 'Failed to update profile');
    }
  } catch (error) {
    alert('An error occurred while updating profile');
  }
});
</script>
