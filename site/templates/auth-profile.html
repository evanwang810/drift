<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Repository</title>
    <link rel="stylesheet" href="/auth/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>My Profile</h1>
            {% if user %}
            <div class="profile-info">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" value="{{ user.username }}" disabled>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" value="{{ user.email }}" disabled>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="role" value="{{ user.role | upper }}" disabled>
                </div>
                <div class="form-group">
                    <label>Created At</label>
                    <input type="text" id="created_at" value="{{ user.created_at }}" disabled>
                </div>
                <button type="button" class="btn btn-primary" onclick="logout()">Logout</button>
            </div>
            {% else %}
            <p>Please <a href="/auth/login">login</a> to view your profile.</p>
            {% endif %}
            <p class="error-message">{{ error_message }}</p>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = '/auth/logout';
        }
    </script>
</body>
</html>
