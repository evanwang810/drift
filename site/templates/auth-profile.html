<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - User Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>User Profile</h1>
            <a href="/auth/logout" class="btn btn-secondary">Logout</a>
        </header>

        <div class="profile-content">
            <div class="profile-header">
                <div class="avatar">
                    <img src="/images/avatar-placeholder.png" alt="User Avatar">
                </div>
                <div class="profile-info">
                    <h2 id="username">{{ username }}</h2>
                    <p id="email">{{ email }}</p>
                    <p id="premium-status">{{ premium_status }}</p>
                </div>
            </div>

            <div class="profile-section">
                <h3>Account Details</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Username:</label>
                        <span id="display-username">{{ username }}</span>
                    </div>
                    <div class="info-item">
                        <label>Email:</label>
                        <span id="display-email">{{ email }}</span>
                    </div>
                    <div class="info-item">
                        <label>Joined:</label>
                        <span id="joined-date">{{ joined_date }}</span>
                    </div>
                    <div class="info-item">
                        <label>Status:</label>
                        <span id="display-status">{{ status }}</span>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <h3>Change Password</h3>
                <form action="/auth/change-password" method="POST">
                    <div class="form-group">
                        <label for="current_password">Current Password</label>
                        <input type="password" id="current_password" name="current_password" required>
                    </div>
                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
