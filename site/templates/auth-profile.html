---
layout: default
title: My Profile
---
<div class="auth-container">
  <div class="auth-card">
    <h1>My Profile</h1>
    <div id="profile-content">
      <div class="profile-header">
        <h2 id="profile-username">Loading...</h2>
        <span id="profile-role" class="badge">Loading...</span>
      </div>
      <div class="form-group">
        <label for="profile-email">Email</label>
        <input type="email" id="profile-email" readonly>
      </div>
      <div class="form-group">
        <label for="profile-created">Account Created</label>
        <input type="text" id="profile-created" readonly>
      </div>
      <div class="form-actions">
        <button id="update-profile-btn" class="btn btn-primary">Update Profile</button>
        <button id="change-password-btn" class="btn btn-secondary">Change Password</button>
        <button id="logout-btn" class="btn btn-danger">Logout</button>
      </div>
    </div>
    <div id="profile-edit-form" style="display: none;">
      <form id="profile-edit-form-element">
        <div class="form-group">
          <label for="edit-username">Username</label>
          <input type="text" id="edit-username" name="username">
        </div>
        <div class="form-group">
          <label for="edit-email">Email</label>
          <input type="email" id="edit-email" name="email">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
