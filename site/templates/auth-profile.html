---
layout: default
title: My Profile - Premium Content
---

<div class="auth-container">
  <div class="auth-box">
    <h1>My Profile</h1>

    <form id="profileForm" action="/api/auth/profile" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="50">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" required>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password (leave blank to keep current)</label>
        <input type="password" id="newPassword" name="newPassword" minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword">
      </div>

      <button type="submit" class="btn btn-primary">Update Profile</button>
    </form>

    <div id="profileMessage" class="message"></div>

    <div class="auth-link">
      <a href="/auth/logout">Logout</a>
    </div>
  </div>
</div>

<script>
document.getElementById('profileForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;

  if (newPassword && newPassword !== confirmNewPassword) {
    showMessage('New passwords do not match', 'error');
    return;
  }

  const formData = new FormData(this);
  const data = Object.fromEntries(formData);

  // Remove confirmPassword from data
  delete data.confirmNewPassword;

  try {
    const response = await fetch('/api/auth/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      showMessage('Profile updated successfully!', 'success');
    } else {
      showMessage(result.message || 'Failed to update profile', 'error');
    }
  } catch (error) {
    showMessage('Error updating profile: ' + error.message, 'error');
  }
});

function showMessage(message, type) {
  const messageDiv = document.getElementById('profileMessage');
  messageDiv.textContent = message;
  messageDiv.className = 'message ' + type;
}
</script>
