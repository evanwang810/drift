<div class="container">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Sign in to access your account</p>
    
    <form method="POST" action="/api/auth/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="remember" class="checkbox-label">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-large">Sign In</button>
    </form>
    
    <div class="auth-links">
      <p>Don't have an account? <a href="/register" class="link-primary">Create an account</a></p>
      <p><a href="/forgot-password" class="link-primary">Forgot your password?</a></p>
    </div>
  </div>
</div>

<link rel="stylesheet" href="styles.css">
