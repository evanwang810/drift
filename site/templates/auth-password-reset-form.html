---
layout: default
title: New Password - Authentication
---

<div class="auth-container">
  <div class="auth-box">
    <h1>Set New Password</h1>
    <p class="auth-subtitle">Enter your new password below</p>

    <form id="resetForm" class="auth-form">
      <input type="hidden" id="token" name="token" required>

      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>

    <div id="error-message" class="error-message"></div>

    <div class="auth-footer">
      <p><a href="/auth/login.html">Back to Sign In</a></p>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Get token from URL
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('error-message').textContent = 'Invalid or missing reset token';
    document.getElementById('resetForm').style.display = 'none';
  } else {
    document.getElementById('token').value = token;
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const token = document.getElementById('token').value;
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    alert('Passwords do not match');
    return;
  }

  try {
    const response = await fetch('/api/auth/reset-password-confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ token, password })
    });

    const data = await response.json();

    if (response.ok) {
      alert('Password has been reset successfully. Please sign in.');
      window.location.href = '/auth/login.html';
    } else {
      document.getElementById('error-message').textContent = data.message || 'Password reset failed';
    }
  } catch (error) {
    document.getElementById('error-message').textContent = 'An error occurred. Please try again.';
  }
});
</script>
