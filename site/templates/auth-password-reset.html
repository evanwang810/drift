---
layout: auth
title: Reset Password - {{ site.name }}
---

<div class="auth-container">
    <h1>Reset Password</h1>
    <p class="auth-subtitle">Enter your email to receive a password reset link</p>

    <form id="resetForm" class="auth-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="your@email.com">
        </div>

        <div id="resetError" class="error-message" style="display: none;"></div>
        <div id="resetSuccess" class="success-message" style="display: none;"></div>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <div class="auth-links">
        <p>Remember your password? <a href="/login">Sign In</a></p>
    </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;

    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
            showSuccess('If an account exists with this email, you will receive a password reset link.');
            document.getElementById('resetForm').reset();
        } else {
            showError(data.message || 'Request failed');
        }
    } catch (error) {
        showError('Network error. Please try again.');
    }
});

function showError(message) {
    const errorDiv = document.getElementById('resetError');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    document.getElementById('resetSuccess').style.display = 'none';
}

function showSuccess(message) {
    const successDiv = document.getElementById('resetSuccess');
    successDiv.textContent = message;
    successDiv.style.display = 'block';
    document.getElementById('resetError').style.display = 'none';
}
</script>
