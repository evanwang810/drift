---
layout: default
title: Reset Password - Premium Content
---

<div class="auth-container">
  <div class="auth-box">
    <h1>Reset Password</h1>
    <p>Enter your email to receive a password reset link</p>

    <form id="resetForm" action="/api/auth/reset-password" method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>

    <p class="auth-link">Remember your password? <a href="/auth/login">Login</a></p>

    <div id="resetMessage" class="message"></div>
  </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const data = Object.fromEntries(formData);

  try {
    const response = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      showMessage('Password reset link sent to your email', 'success');
    } else {
      showMessage(result.message || 'Failed to send reset link', 'error');
    }
  } catch (error) {
    showMessage('Error sending reset link: ' + error.message, 'error');
  }
});

function showMessage(message, type) {
  const messageDiv = document.getElementById('resetMessage');
  messageDiv.textContent = message;
  messageDiv.className = 'message ' + type;
}
</script>
