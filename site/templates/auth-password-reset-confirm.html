---
layout: auth
title: Reset Password - {{ site.name }}
---

<div class="auth-container">
    <h1>Reset Password</h1>
    <p class="auth-subtitle">Enter your new password</p>

    <form id="confirmForm" class="auth-form">
        <div class="form-group">
            <label for="token">Reset Token</label>
            <input type="text" id="token" name="token" required
                   placeholder="Enter your reset token">
            <small class="form-text">This was sent to your email</small>
        </div>

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Choose a new password" minlength="8">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required
                   placeholder="Confirm your new password">
        </div>

        <div id="confirmError" class="error-message" style="display: none;"></div>
        <div id="confirmSuccess" class="success-message" style="display: none;"></div>

        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <div class="auth-links">
        <p>Remember your password? <a href="/login">Sign In</a></p>
    </div>
</div>

<script>
document.getElementById('confirmForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const token = document.getElementById('token').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Validate passwords match
    if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
    }

    // Validate password strength
    if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
    }

    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (response.ok) {
            showSuccess('Password reset successfully! You can now sign in with your new password.');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            showError(data.message || 'Password reset failed');
        }
    } catch (error) {
        showError('Network error. Please try again.');
    }
});

function showError(message) {
    const errorDiv = document.getElementById('confirmError');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    document.getElementById('confirmSuccess').style.display = 'none';
}

function showSuccess(message) {
    const successDiv = document.getElementById('confirmSuccess');
    successDiv.textContent = message;
    successDiv.style.display = 'block';
    document.getElementById('confirmError').style.display = 'none';
}
</script>
