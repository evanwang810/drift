---
layout: auth
title: Reset Password Confirmation
---

<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Your Password</h2>
    <form id="confirmResetForm" action="/auth/reset-password-confirm" method="POST">
      <input type="hidden" name="token" id="token" required>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  </div>
</div>

<div id="resetSuccess" style="display: none;" class="auth-container">
  <div class="auth-card">
    <h2>Password Reset Successful!</h2>
    <p>Your password has been successfully reset. You can now login with your new password.</p>
    <p class="auth-link">
      <a href="/auth/login">Login</a>
    </p>
  </div>
</div>

{% if messages %}
  <div class="auth-messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.type }}">{{ message.text }}</div>
    {% endfor %}
  </div>
{% endif %}

<script>
document.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (token) {
    document.getElementById('token').value = token;
  } else {
    alert('Invalid reset link. Please request a new password reset.');
    window.location.href = '/auth/password-reset';
  }
});

document.getElementById('confirmResetForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;

  if (newPassword !== confirmNewPassword) {
    alert('Passwords do not match');
    return;
  }

  const formData = new FormData(this);
  const response = await fetch('/auth/reset-password-confirm', {
    method: 'POST',
    body: formData
  });

  const data = await response.json();

  if (response.ok) {
    document.getElementById('confirmResetForm').style.display = 'none';
    document.getElementById('resetSuccess').style.display = 'block';
  } else {
    alert(data.message || 'Failed to reset password');
  }
});
</script>
