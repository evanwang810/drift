<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Repository Website</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Set New Password</h1>
                <p>Choose a new password for your account</p>
            </div>

            <div class="auth-form">
                <form method="POST" action="/auth/reset-password-confirm" id="confirmResetForm">
                    <div class="form-group">
                        <label for="token">Reset Token</label>
                        <input type="text" id="token" name="token" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="8">
                        <small class="form-hint">Minimum 8 characters with uppercase, lowercase, and number</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required>
                    </div>

                    {% if error %}
                    <div class="alert alert-error">{{ error }}</div>
                    {% endif %}

                    {% if success %}
                    <div class="alert alert-success">{{ success }}</div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary btn-block">Update Password</button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <a href="/auth/login">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get token and email from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (token && email) {
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;
        }

        document.getElementById('confirmResetForm').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                e.preventDefault();
                alert('Passwords do not match. Please try again.');
            }

            // Validate password complexity
            const hasUpperCase = /[A-Z]/.test(newPassword);
            const hasLowerCase = /[a-z]/.test(newPassword);
            const hasNumber = /[0-9]/.test(newPassword);

            if (!hasUpperCase || !hasLowerCase || !hasNumber) {
                e.preventDefault();
                alert('Password must contain uppercase, lowercase, and numbers.');
            }
        });
    </script>
</body>
</html>
